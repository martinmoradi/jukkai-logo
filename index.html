<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>logo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-eye"><path d="M1.6 12S5.6 4.5 12 4.5 22.4 12 22.4 12 18.4 19.5 12 19.5 1.6 12 1.6 12Z"/><circle cx="12" cy="12" r="3.2"/></g>
    <g id="i-eye-off"><path d="M9.9 5a9.9 9.9 0 0 1 2.1-.2c6.4 0 10.4 7.2 10.4 7.2a19 19 0 0 1-2.7 3.7M6.5 6.6A18.7 18.7 0 0 0 1.6 12S5.6 19.5 12 19.5a9.9 9.9 0 0 0 4.1-.9"/><path d="M14.2 14.3a3.2 3.2 0 0 1-4.5-4.5"/><path d="M3.5 3.5l17 17"/></g>
  </defs>
</svg>

<header>
  <span id="counter" class="counter"></span>
  <div class="toggle" role="group" aria-label="View">
    <button id="view-full" aria-label="Single view" aria-pressed="true">
      <svg viewBox="0 0 16 16" class="solid" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/></svg>
    </button>
    <button id="view-grid" aria-label="Grid view" aria-pressed="false">
      <svg viewBox="0 0 16 16" class="solid" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.5"/></svg>
    </button>
  </div>
</header>

<main id="full" class="full">
  <button id="prev" class="nav prev" aria-label="Previous">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
  </button>
  <figure id="stage"><img id="photo" alt=""></figure>
  <button id="next" class="nav next" aria-label="Next">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
  </button>
  <button id="hide" class="hide" aria-label="Hide this image" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-eye-off"></use></svg>
  </button>
</main>

<main id="grid" class="grid" hidden></main>

<script src="manifest.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
